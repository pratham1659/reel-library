name: ReelLibrary
options:
  bundleIdPrefix: io.github.alokkr016
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupSortPosition: top
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "6.29.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  ReelLibrary:
    type: application
    platform: iOS
    sources:
      - path: ReelLibrary
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alokkr016.reellibrary
        INFOPLIST_FILE: ReelLibrary/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GRDB

  ReelLibraryShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ReelLibraryShare
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
      - path: ReelLibrary/Core
      - path: ReelLibrary/Worker/InstagramUrlParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alokkr016.reellibrary.share
        INFOPLIST_FILE: ReelLibraryShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: ReelLibraryShare/ReelLibraryShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: GRDB

  ReelLibraryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReelLibraryTests
    dependencies:
      - target: ReelLibrary
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alokkr016.reellibrary.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ReelLibrary:
    build:
      targets:
        ReelLibrary: all
    test:
      targets:
        - ReelLibraryTests
  ReelLibraryShare:
    build:
      targets:
        ReelLibraryShare: all
  ReelLibraryTests:
    build:
      targets:
        ReelLibraryTests: all
    test:
      targets:
        - ReelLibraryTests
