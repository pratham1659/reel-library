<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reel Library Update Service</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #f8fafc;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin: 0 0 24px 0;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    a.btn {
      display: block;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    a.primary {
      background: #06b6d4;
      color: #0f172a;
    }
    a.primary:hover {
      background: #22d3ee;
    }
    a.secondary {
      background: #334155;
      color: #f1f5f9;
    }
    a.secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Service Operational</div>
    <h1>Reel Library Updates</h1>
    <p>In-app software update API for Android.</p>
    <div class="btn-group">
      <a href="/check" class="btn primary">Check Version API (/check)</a>
      <a href="/download" class="btn secondary">Download Latest APK (/download)</a>
    </div>
  </div>
</body>
</html>
