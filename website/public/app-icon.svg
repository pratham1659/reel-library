<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="reelBg" x1="14" y1="94" x2="94" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCAF45" />
      <stop offset="20%" stop-color="#FF5252" />
      <stop offset="50%" stop-color="#E1306C" />
      <stop offset="80%" stop-color="#C13584" />
      <stop offset="100%" stop-color="#5851DB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E1306C" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle with Sunset Pink & Purple Gradient -->
  <rect x="0" y="0" width="108" height="108" rx="24" fill="url(#reelBg)" />

  <!-- Outer Rounded Reel Squircle Outline (Pure White, No Dot) -->
  <path
    d="M38,30 L70,30 A12,12 0 0,1 82,42 L82,66 A12,12 0 0,1 70,78 L38,78 A12,12 0 0,1 26,66 L26,42 A12,12 0 0,1 38,30 Z"
    stroke="#FFFFFF"
    stroke-width="3.5"
    fill="none"
    filter="url(#glow)" />

  <!-- Center Circle -->
  <path
    d="M54,42 A12,12 0 1,1 54,66 A12,12 0 1,1 54,42 Z"
    stroke="#FFFFFF"
    stroke-width="3"
    fill="none" />

  <!-- Center Play Arrow Glyph -->
  <path
    d="M51,48 L60,54 L51,60 Z"
    fill="#FFFFFF" />
</svg>
